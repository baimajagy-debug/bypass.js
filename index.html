<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass SFL</title>
    <style>
        :root {
            --bg: #0b0d12;
            --card: #141821;
            --border: #232836;
            --text: #e5e7eb;
            --muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="url"] {
            flex: 1;
            padding: 0.75rem 1rem;
            background: #0f1219;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input[type="url"]::placeholder {
            color: #4b5563;
        }

        button {
            padding: 0.75rem 1.25rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background: #374151;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button.loading .spinner {
            display: inline-block;
        }

        button.loading .btn-text {
            display: none;
        }

        .result {
            display: none;
            background: #0f1219;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-top: 0.5rem;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .result.visible {
            display: block;
        }

        .label {
            color: var(--muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.3rem;
        }

        .url-link {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            font-size: 0.9rem;
        }

        .url-link:hover {
            text-decoration: underline;
        }

        .divider {
            border-top: 1px solid var(--border);
            margin: 0.9rem 0;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .error-message {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SFL Bypass</h1>
        <p class="subtitle">Tempel URL sfl.gl untuk mendapatkan tujuan aslinya.</p>

        <form id="bypassForm" autocomplete="off">
            <input
                type="url"
                id="urlInput"
                placeholder="https://sfl.gl/xxxxx"
                required
                spellcheck="false"
            >
            <button type="submit" id="btnSubmit">
                <span class="spinner"></span>
                <span class="btn-text">Bypass</span>
            </button>
        </form>

        <!-- Hasil sukses -->
        <div class="result" id="resultBox">
            <div class="label">Link Tujuan</div>
            <a class="url-link" id="resultUrl" href="#" target="_blank" rel="noopener noreferrer"></a>
            <div class="divider"></div>
            <div class="meta">
                <span id="resultAlias"></span>
                <span id="resultDuration"></span>
            </div>
        </div>

        <!-- Hasil error -->
        <div class="result" id="errorBox">
            <span class="status-badge error">Error</span>
            <p class="error-message" id="errorMessage"></p>
        </div>

        <div class="footer">bypass by baim</div>
    </div>

    <script>
        const form = document.getElementById('bypassForm');
        const urlInput = document.getElementById('urlInput');
        const btn = document.getElementById('btnSubmit');
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');
        const resultUrl = document.getElementById('resultUrl');
        const resultAlias = document.getElementById('resultAlias');
        const resultDuration = document.getElementById('resultDuration');
        const errorMessage = document.getElementById('errorMessage');

        function resetResults() {
            resultBox.classList.remove('visible');
            errorBox.classList.remove('visible');
            resultBox.style.display = 'none';
            errorBox.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = urlInput.value.trim();
            if (!url) return;

            resetResults();

            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch('/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    resultUrl.textContent = data.destination;
                    resultUrl.href = data.destination;
                    resultAlias.textContent = data.alias ? `Alias: ${data.alias}` : '';
                    resultDuration.textContent = data.duration || '';
                    resultBox.style.display = 'block';
                    requestAnimationFrame(() => resultBox.classList.add('visible'));
                } else {
                    errorMessage.textContent = data.message || 'Terjadi kesalahan saat memproses URL.';
                    errorBox.style.display = 'block';
                    requestAnimationFrame(() => errorBox.classList.add('visible'));
                }
            } catch (err) {
                errorMessage.textContent = 'Gagal terhubung ke server. Pastikan backend berjalan.';
                errorBox.style.display = 'block';
                requestAnimationFrame(() => errorBox.classList.add('visible'));
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });

        // Fokus ke input saat halaman dimuat
        urlInput.focus();
    </script>
</body>
</html>
